<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#f3f2ec"/>
  <rect x="120" y="170" width="120" height="60" rx="8" fill="#fff" stroke="#285840" stroke-width="2"/>
  <text x="180" y="205" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#285840" letter-spacing="1">COST SPIKE</text>
  <path d="M240 200 L320 200" stroke="#285840" stroke-width="2"/>
