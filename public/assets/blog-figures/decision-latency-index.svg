<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#f3f2ec"/>
  <rect x="100" y="180" width="160" height="60" rx="6" fill="#fff" stroke="#271675" stroke-width="2"/>
  <text x="180" y="214" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#131313">OPPORTUNITY</text>
  <rect x="320" y="180" width="100" height="60" rx="6" fill="#fff" stroke="#271675" stroke-width="2"/>
  <text x="370" y="214" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#131313">×</text>
  <rect x="460" y="180" width="120" height="60" rx="6" fill="#fff8f6" stroke="#b85848" stroke-width="2"/>
  <text x="520" y="214" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#b85848">DELAY</text>
  <rect x="620" y="180" width="100" height="60" rx="6" fill="#fff" stroke="#271675" stroke-width="2"/>
  <text x="670" y="214" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#131313">COST</text>
  <path d="M260 210 L320 210" stroke="#271675" stroke-width="2" fill="none"/>
  <path d="M420 210 L460 210" stroke="#271675" stroke-width="2" fill="none"/>
  <path d="M580 210 L620 210" stroke="#271675" stroke-width="2" fill="none"/>
  <text x="400" y="410" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#171717">Decision Cost = Opportunity × Delay</text>
</svg>