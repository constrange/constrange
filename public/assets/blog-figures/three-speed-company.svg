<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#f3f2ec"/>
  <rect x="100" y="170" width="150" height="70" rx="6" fill="#fff" stroke="#271675" stroke-width="2"/>
  <text x="175" y="209" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#131313">EXPLORE</text>
  <rect x="325" y="170" width="150" height="70" rx="6" fill="#fff8f6" stroke="#b85848" stroke-width="2"/>
  <text x="400" y="209" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#b85848">GROW</text>
  <rect x="550" y="170" width="150" height="70" rx="6" fill="#fff" stroke="#271675" stroke-width="2"/>
  <text x="625" y="209" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#131313">RUN</text>
  <text x="175" y="280" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#271675">QUARTERS</text>
  <text x="400" y="280" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#b85848">MONTHS</text>
  <text x="625" y="280" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#271675">WEEKS</text>
  <text x="400" y="410" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#171717">Three clocks: explore, grow, run</text>
</svg>